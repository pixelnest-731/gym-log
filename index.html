<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUSCULARS</title>
<meta name="apple-mobile-web-app-title" content="MUSCULARS">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
:root{--bg:#0b0d10;--card:#15181d;--fg:#f1f3f6;--mut:#8b93a1;--ac:#d4a017;--ac2:#ffd23f;--bd:#262b33;--sh:0 6px 24px rgba(0,0,0,.45);--chip:#1f242c;--steel:#c9d1dc;color-scheme:dark;
 --disp:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;--body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding-bottom:84px}
header{background:linear-gradient(135deg,#9c7410,#d4a017 55%,#ffd23f);color:#fff;padding:22px 16px 56px;position:relative;overflow:hidden}
header h1{margin:0;font-size:22px;letter-spacing:.05em}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
main{max-width:920px;margin:-40px auto 0;padding:0 16px;position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh);text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--ac)}
.stat .l{font-size:11px;color:var(--mut)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2))}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font-size:15px}
input:focus,select:focus{outline:2px solid var(--ac2);border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn{margin-top:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(212,160,23,.3)}
.btn.gray{background:#8a8f99;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:300px;overflow:auto;margin-top:10px;padding:2px}
.ex{border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:var(--fg);font-size:13px}
.ex small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.ex.on{border-color:var(--ac);background:rgba(212,160,23,.08);font-weight:700}
.sel{margin-top:10px;padding:10px;border-radius:10px;background:var(--chip);font-size:14px}
.log{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.log:last-child{border:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--chip)}
.log .t{flex:1;min-width:0}.log .t b{display:block;font-size:14px}.log .t span{font-size:12px;color:var(--mut)}
.sm{padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.dh{font-size:12px;font-weight:700;color:var(--ac);margin-top:14px}
.big{font-size:40px;font-weight:800}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.adv li{list-style:none;margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--chip);line-height:1.6;font-size:14px}
.adv{padding:0;margin:0}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:9}
.tabbar button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;cursor:pointer}
.tabbar button i{display:block;font-style:normal;font-size:22px}
.tabbar button.on{color:var(--ac);font-weight:700}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);color:var(--fg);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center}
.modal .btn{margin:14px 4px 0}
.modal.hidden{display:none}
.homebtn{position:absolute;right:14px;top:16px;z-index:2;border:0;background:rgba(255,255,255,.22);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.bigbtn{width:100%;border:0;border-radius:16px;padding:18px;margin-bottom:16px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#9c7410,#d4a017,#ffd23f);box-shadow:0 6px 18px rgba(212,160,23,.35)}
.bigbtn small{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:4px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.cal .d{min-height:58px;border-radius:10px;background:var(--bg);padding:4px;cursor:pointer;font-size:12px;border:2px solid transparent;overflow:hidden}
.cal .d.o{opacity:.35}.cal .d.t .n{background:var(--ac);color:#fff;border-radius:50%;display:inline-block;width:20px;text-align:center}
.cal .d.s{border-color:var(--ac)}.cal .d.has{background:rgba(212,160,23,.1)}
.cal .ic{font-size:11px;line-height:1.1;word-break:break-all}
.chr{display:flex;gap:14px;align-items:center}
.chr .face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#dbeafe,#93c5fd);flex:none}
.chr .nm{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--mut)}
.pbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:8px 0 4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.win{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.win span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}.sync .sub{margin:0}
.timer{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:10px 12px;border:2px solid var(--ac);border-radius:999px;font-size:13px}
.timer input{width:64px;padding:6px;text-align:center}.timer b{margin-left:auto;font-size:18px;color:var(--ac);font-variant-numeric:tabular-nums}
.sethead,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 64px 30px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--mut);margin-top:8px;padding:0 4px}
.setrow{padding:8px 4px;border-bottom:1px solid var(--bd)}.setrow .no{font-size:18px;font-weight:700;text-align:center}
.setrow input{padding:8px;text-align:right;font-size:16px;font-weight:700}.setrow .rmv{font-size:13px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.setrow .memo{grid-column:2/5;padding:6px 8px;font-size:13px;font-weight:400;text-align:left}
.setrow .x{border:0;background:var(--chip);color:var(--mut);border-radius:50%;width:26px;height:26px;cursor:pointer}
.setbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.evtop{display:flex;align-items:center;gap:14px}.rank{width:64px;height:64px;border-radius:16px;color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;flex:none}
.score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.score small{font-size:14px;color:var(--mut);font-weight:400}
.coach{margin:12px 0 4px;padding:12px;border-radius:12px;background:var(--chip);font-size:14px;line-height:1.6}
.evrow{margin-top:12px}.evh{display:flex;justify-content:space-between;font-size:13px}.evh span{color:var(--mut);font-variant-numeric:tabular-nums}.evrow .pbar{margin:4px 0}
.w.sun{color:#ef4444}.w.sat{color:#60a5fa}
.empty{text-align:center;color:var(--mut);padding:20px;font-size:14px}

/* ===== MUSCULARS theme ===== */
.tabbar button i svg{width:24px;height:24px;display:block;margin:0 auto 3px}
.tabbar button i{font-size:0}
.homebtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:16px!important;letter-spacing:.08em}.homebtn svg{width:16px;height:16px}
.pbadge{display:grid;place-items:center;width:100%;height:100%;border-radius:10px;background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);font-weight:900;font-size:16px}
.ico{background:none!important;padding:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px;vertical-align:middle}
.chip .dot{margin-right:6px}
.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px;white-space:nowrap}
.cal .ic{display:flex;flex-wrap:wrap;gap:1px;margin-top:4px}
.coach .tag,.adv li::before{display:inline-block;font-family:var(--disp);letter-spacing:.1em;background:var(--ac);color:#111;padding:1px 8px;border-radius:3px;margin-right:8px;font-size:14px}
.adv li{border-left:3px solid var(--ac)}
#hello{cursor:pointer;margin-top:14px;max-width:calc(100% - 120px)!important;position:relative;padding:12px 14px 12px 16px;border-left:5px solid var(--qc,var(--ac2));
 background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15));border-radius:4px 12px 12px 4px;transform:skewX(-4deg);animation:qin .5s ease-out}
#hello>*{transform:skewX(4deg)}
#hello::before{content:"“";position:absolute;left:6px;top:-26px;font-family:Georgia,serif;font-size:72px;line-height:1;color:var(--qc,var(--ac2));opacity:.55}
#hello .q{display:block;font-size:19px;font-weight:900;line-height:1.45;text-wrap:balance;letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#hello .q.long{font-size:15px}
#hello .qs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:700;color:#e9e9e9}
#hello .wk{background:var(--qc,var(--ac2));color:var(--qt,#111);padding:2px 8px;border-radius:3px;font-size:11px;font-weight:900;letter-spacing:.06em}
#hello .qnav{margin-left:auto;display:flex;gap:6px}#hello .qnav button{border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
@keyframes qin{from{opacity:0;transform:skewX(-4deg) translateX(-12px)}to{opacity:1;transform:skewX(-4deg)}}
@media(prefers-reduced-motion:reduce){#hello{animation:none}}
.btn,.bigbtn,.chip.on{color:#111!important}
.bigbtn small{color:#2b2200}
.bigbtn svg g{fill:#111}
header{border-bottom:3px solid var(--ac)}
header h1{background:linear-gradient(180deg,#fff6cf,#ffd23f 45%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
header h1 span{color:inherit}
.stat .v{color:var(--ac2)}
.rank{color:#111}
[hidden]{display:none!important}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(212,160,23,.18),transparent 60%),var(--bg)}
header{box-shadow:inset 0 -40px 60px rgba(0,0,0,.35);background:linear-gradient(160deg,#000 0%,#14100a 45%,#3a2c08 80%,#6b5210 100%);padding:26px 16px 110px;border-bottom:3px solid var(--ac2)}
header::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px);pointer-events:none}
header::after{content:none}
header h1{font-family:var(--disp);font-size:50px;font-style:italic;font-weight:400;letter-spacing:.06em;line-height:1;position:relative;text-shadow:0 3px 0 rgba(0,0,0,.35)}
header h1 span{color:var(--ac2)}
header p{position:relative;font-weight:700;letter-spacing:.04em;max-width:calc(100% - 130px)}
.hero-art{position:absolute;right:10px;top:62px;width:170px;height:150px;opacity:.95;pointer-events:none}
@media(max-width:420px){.hero-art{width:120px;height:106px;top:70px}}
.homebtn{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
.stat{background:linear-gradient(180deg,#1a1f27,#13161b);border:1px solid var(--bd);text-align:left;padding:12px 14px}
.stat .v{font-family:var(--disp);font-size:34px;font-weight:400;color:var(--ac2);line-height:1}
.stat .l{letter-spacing:.06em;font-weight:700}
.card{border:1px solid var(--bd);border-radius:14px}
.card h3{font-family:var(--body);font-weight:900;letter-spacing:.04em;font-size:15px}
.card h3::before{width:6px;height:20px;border-radius:1px;background:var(--ac2);transform:skewX(-15deg)}
.btn,.chip.on{background:linear-gradient(135deg,#9c7410,var(--ac));box-shadow:0 4px 16px rgba(212,160,23,.35);letter-spacing:.04em}
.btn{border-radius:10px;text-transform:uppercase}
.btn.gray{background:#2a2f38}
.bigbtn{position:relative;overflow:hidden;text-align:left;padding:20px 20px 20px 92px;border-radius:14px;background:linear-gradient(120deg,#9c7410,#d4a017 60%,#ffd23f);font-family:var(--body);font-weight:900;letter-spacing:.03em}
.bigbtn::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px)}
.bigbtn svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:62px;height:62px}
.ex.on{background:rgba(212,160,23,.15)}
.cal .d{background:#12151a}.cal .d.has{background:rgba(212,160,23,.18);border-color:rgba(212,160,23,.35)}
.cal .d.t .n{background:var(--ac);color:#fff}
.calh b{font-family:var(--disp);font-size:28px;font-weight:400;letter-spacing:.06em}
.rank{font-family:var(--disp);font-size:44px;font-weight:400;border-radius:12px;transform:skewX(-6deg)}
.score{font-family:var(--disp);font-size:52px;font-weight:400;line-height:1}
.tabbar{background:#0f1216;border-top:1px solid var(--bd)}
.tabbar button.on{color:var(--ac2)}
.pbar i{background:linear-gradient(90deg,#9c7410,var(--ac2))}
.coach{border-left:4px solid var(--ac2)}
.ico{background:#1f242c}
.foot-art{display:block;margin:8px auto 0;width:100%;max-width:520px;opacity:.5}
</style>
<header><h1 onclick="goHome()" style="cursor:pointer">MUSCU<span>LARS</span></h1><p id="hello" title="タップで次の名言"></p><svg class="hero-art" viewBox="0 0 170 150" aria-hidden="true">
 <g fill="none" stroke="#f3f3f3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <line x1="12" y1="28" x2="158" y2="28" stroke="#e8eef8" stroke-width="5"/>
  <path d="M60 28 L68 58 L85 66 L102 58 L110 28"/>
  <path d="M85 66 L85 102"/>
  <path d="M85 102 L66 122 L62 146 M85 102 L104 122 L108 146"/>
 </g>
 <circle cx="85" cy="50" r="10" fill="#f3f3f3"/>
 <g fill="#ffd23f"><rect x="10" y="10" width="12" height="36" rx="3"/><rect x="24" y="15" width="8" height="26" rx="2"/><rect x="148" y="10" width="12" height="36" rx="3"/><rect x="138" y="15" width="8" height="26" rx="2"/></g>
</svg></header>
<main>
<div class="stats">
 <div class="stat"><div class="v" id="sDays">0</div><div class="l">総トレ日数</div></div>
 <div class="stat"><div class="v" id="sWeek">0</div><div class="l">今週の日数</div></div>
 <div class="stat"><div class="v" id="sVol">0</div><div class="l">今週ボリューム(t)</div></div>
 <div class="stat"><div class="v" id="sBmi">-</div><div class="l">最新BMI</div></div>
</div>

<section id="home">
 <div class="card sync" id="syncCard"><div class="sub" id="syncMsg">読み込み中…</div><button class="sm" id="syncBtn" hidden></button></div>
 <button class="bigbtn" onclick="goMenu()"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#fff"><rect x="4" y="22" width="8" height="20" rx="2"/><rect x="13" y="16" width="8" height="32" rx="2"/><rect x="43" y="16" width="8" height="32" rx="2"/><rect x="52" y="22" width="8" height="20" rx="2"/><rect x="21" y="29" width="22" height="6" rx="2"/></g></svg>今日のメニューをおまかせで組む<small>休んでいる部位から自動でメニューを作ります</small></button>
 <div class="card">
  <div class="calh"><button class="sm" onclick="mv(-1)">◀</button><b id="calM"></b><button class="sm" onclick="mv(1)">▶</button></div>
  <div class="cal" id="cal"></div>
  <div class="mut" style="font-size:11px;color:var(--mut);margin-top:8px" id="legend"></div>
 </div>
 <div class="card"><h3 id="dayT"></h3><div id="dayList"></div><button class="btn" onclick="addOn()">＋ この日に記録を追加</button></div>
 <div class="card" id="evalCard"></div>
</section>

<section id="train" class="hidden">
 <div class="card">
  <h3 id="tTitle">トレーニングを記録</h3>
  <label>部位</label><div class="chips" id="parts"></div>
  <label>器具</label><div class="chips" id="eqs"></div>
  <input id="q" placeholder="種目を検索" style="margin-top:10px">
  <div class="exgrid" id="exs"></div>
  <div class="sel" id="selEx">種目を選んでください</div>
  <div class="row">
   <div><label>日付</label><input type="date" id="tDate"></div>
   <div class="cd hidden"><label>時間(分)</label><input type="number" id="tMin"></div>
   <div class="cd hidden"><label>距離(km)</label><input type="number" id="tKm" step="0.1"></div>
  </div>
  <div class="st">
   <div class="timer"><span>REST</span><input type="number" id="tmSec" value="60" min="5" step="5"><span>秒</span><b id="tmLeft"></b><button class="sm" id="tmBtn">START</button></div>
   <div class="sethead"><span>セット</span><span>重さ(kg)</span><span>回数</span><span>RM</span><span></span></div>
   <div id="sets"></div>
   <div class="setbtns"><button class="sm" id="addSet">＋ セットを追加</button><button class="sm" id="copyLast">前回の記録をコピー</button></div>
  </div>
  <label>種目のメモ（マシン番号・シート位置など）</label><input id="tMemo">
  <button class="btn" id="tSave">保存する</button> <button class="btn gray hidden" id="tCancel">キャンセル</button>
 </div>
 <div class="card"><h3>履歴</h3><div id="tList"></div></div>
</section>

<section id="body" class="hidden">
 <div class="card" style="text-align:center"><div style="font-size:12px;color:var(--mut)">最新BMI</div><div class="big" id="bmi">-</div><span class="badge" id="bmiJ"></span></div>
 <div class="card">
  <h3 id="bTitle">体の記録</h3>
  <div class="row">
   <div><label>日付</label><input type="date" id="bDate"></div>
   <div><label>身長(cm)</label><input type="number" id="bH" step="0.1"></div>
   <div><label>体重(kg)</label><input type="number" id="bWt" step="0.1"></div>
   <div><label>体脂肪率(%)</label><input type="number" id="bF" step="0.1"></div>
   <div><label>腕周囲 右(cm)</label><input type="number" id="bAR" step="0.1"></div>
   <div><label>腕周囲 左(cm)</label><input type="number" id="bAL" step="0.1"></div>
  </div>
  <button class="btn" id="bSave">保存する</button> <button class="btn gray hidden" id="bCancel">キャンセル</button>
 </div>
 <div class="card"><h3>履歴</h3><div id="bList"></div></div>
</section>

<section id="graph" class="hidden">

const EX=[
["ベンチプレス","胸","バーベル"],["インクラインベンチプレス","胸","バーベル"],["デクラインベンチプレス","胸","バーベル"],

["ケーブルクロスオーバー","胸","ケーブル"],["ケーブルフライ(ロー→ハイ)","胸","ケーブル"],["腕立て伏せ","胸","自重"],["ディップス","胸","自重"],
["デッドリフト","背中","バーベル"],["ルーマニアンデッドリフト","背中","バーベル"],["ベントオーバーロウ","背中","バーベル"],["Tバーロウ","背中","バーベル"],
["ワンハンドロウ","背中","ダンベル"],["ダンベルシュラッグ","背中","ダンベル"],
["ラットプルダウン","背中","マシン"],["シーテッドロウ","背中","マシン"],["ローロウ","背中","マシン"],["バックエクステンション","背中","マシン"],["アシスト懸垂(チンニング)","背中","マシン"],
["ケーブルロウ","背中","ケーブル"],["ストレートアームプルダウン","背中","ケーブル"],["フェイスプル","背中","ケーブル"],["スミス ロウ","背中","スミスマシン"],["懸垂","背中","自重"],
["スクワット","脚","バーベル"],["フロントスクワット","脚","バーベル"],["ヒップスラスト","脚","バーベル"],
["ブルガリアンスクワット","脚","ダンベル"],["ダンベルランジ","脚","ダンベル"],["ゴブレットスクワット","脚","ダンベル"],
["レッグプレス","脚","マシン"],["レッグエクステンション","脚","マシン"],["レッグカール(シーテッド)","脚","マシン"],["レッグカール(ライイング)","脚","マシン"],
["アダクション(内もも)","脚","マシン"],["アブダクション(外もも)","脚","マシン"],["カーフレイズ","脚","マシン"],["ハックスクワット","脚","マシン"],
["スミス スクワット","脚","スミスマシン"],["スミス ランジ","脚","スミスマシン"],["ケーブルキックバック(臀部)","脚","ケーブル"],
["ショルダープレス(バーベル)","肩","バーベル"],["アップライトロウ","肩","バーベル"],
["ダンベルショルダープレス","肩","ダンベル"],["サイドレイズ","肩","ダンベル"],["フロントレイズ","肩","ダンベル"],["リアレイズ","肩","ダンベル"],["アーノルドプレス","肩","ダンベル"],
["ショルダープレス(マシン)","肩","マシン"],["リアデルト(マシン)","肩","マシン"],["ラテラルレイズ(マシン)","肩","マシン"],
["ケーブルサイドレイズ","肩","ケーブル"],["スミス ショルダープレス","肩","スミスマシン"],
["バーベルカール","腕","バーベル"],["EZバーカール","腕","バーベル"],["ナローベンチプレス","腕","バーベル"],["ライイングトライセプスEX","腕","バーベル"],
["ダンベルカール","腕","ダンベル"],["ハンマーカール","腕","ダンベル"],["インクラインカール","腕","ダンベル"],["コンセントレーションカール","腕","ダンベル"],["フレンチプレス","腕","ダンベル"],["キックバック","腕","ダンベル"],
["アームカール(マシン)","腕","マシン"],["トライセプスEX(マシン)","腕","マシン"],["プリーチャーカール","腕","マシン"],
["ケーブルカール","腕","ケーブル"],["トライセプスプッシュダウン","腕","ケーブル"],["オーバーヘッドケーブルEX","腕","ケーブル"],["リストカール","腕","ダンベル"],
["クランチ","腹","自重"],["レッグレイズ","腹","自重"],["プランク(秒)","腹","自重"],["アブローラー","腹","自重"],["ハンギングレッグレイズ","腹","自重"],["ロシアンツイスト","腹","ダンベル"],
["アブドミナル(マシン)","腹","マシン"],["ロータリートルソー","腹","マシン"],["ケーブルクランチ","腹","ケーブル"],["サイドベント","腹","ダンベル"],
["トレッドミル","有酸素","有酸素"],["エアロバイク","有酸素","有酸素"],["クロストレーナー","有酸素","有酸素"],["ステアクライマー","有酸素","有酸素"],["ローイングマシン","有酸素","有酸素"]];
const PARTS=Object.keys(PI),EQS=["すべて","バーベル","ダンベル","マシン","スミスマシン","ケーブル","自重","有酸素"];
const $=id=>document.getElementById(id);
const okStore=(()=>{try{localStorage.setItem("_t","1");return localStorage.getItem("_t")==="1"}catch{return false}})();
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{};cloudSave()};
let T=ld("gym_t"),B=ld("gym_b"),tEdit=null,bEdit=null,charts=[],part="胸",eq="すべて",cur=null;
const today=()=>new Date().toISOString().slice(0,10);
$("tDate").value=$("bDate").value=today();
const isCardio=n=>(EX.find(e=>e[0]===n)||[])[1]==="有酸素";

function renderPicker(){
 $("parts").innerHTML=PARTS.map(p=>`<button class="chip ${p===part?"on":""}" data-p="${p}"><i class="dot" style="background:${PCOL[p]}"></i>${p}</button>`).join("");
 $("eqs").innerHTML=EQS.map(e=>`<button class="chip ${e===eq?"on":""}" data-e="${e}">${e}</button>`).join("");
 const q=$("q").value.trim();
 const list=EX.filter(e=>q?e[0].includes(q):e[1]===part&&(eq==="すべて"||e[2]===eq));
 $("exs").innerHTML=list.length?list.map(e=>`<button class="ex ${cur===e[0]?"on":""}" data-x="${e[0]}">${e[0]}<small>${e[2]}・${e[1]}</small></button>`).join(""):'<div class="empty">該当なし</div>';
 $("selEx").innerHTML=cur?`選択中：<b>${cur}</b>`+last(cur):"種目を選んでください";
 const c=cur&&isCardio(cur);document.querySelectorAll(".st").forEach(x=>x.classList.toggle("hidden",c));document.querySelectorAll(".cd").forEach(x=>x.classList.toggle("hidden",!c));
}
function last(n){const r=T.filter(x=>x.ex===n).sort((a,b)=>a.d<b.d?1:-1)[0];return r?`　<span style="color:var(--mut)">前回 ${r.d}：${fmt(r)}</span>`:""}
$("parts").onclick=e=>{const b=e.target.closest("[data-p]");if(b){part=b.dataset.p;$("q").value="";renderPicker()}};
$("eqs").onclick=e=>{const b=e.target.closest("[data-e]");if(b){eq=b.dataset.e;renderPicker()}};
$("exs").onclick=e=>{const b=e.target.closest("[data-x]");if(b){cur=b.dataset.x;renderPicker()}};
$("q").oninput=renderPicker;

document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll("main section").forEach(s=>s.classList.toggle("hidden",s.id!==b.dataset.t));
 scrollTo(0,0);if(b.dataset.t==="graph")drawAll();if(b.dataset.t==="advice"){advise();if(!MENU.length)genMenu()}if(b.dataset.t==="home")renderCal();});
const tab=t=>document.querySelector(`.tabbar [data-t="${t}"]`).click();
window.goHome=()=>tab("home");
window.goMenu=()=>{tab("advice");genMenu();};
// calendar
let calD=new Date(),selD=today();
window.mv=n=>{calD=new Date(calD.getFullYear(),calD.getMonth()+n,1);renderCal()};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function renderCal(){const y=calD.getFullYear(),m=calD.getMonth();$("calM").textContent=`${y}年${m+1}月`;
 const st=new Date(y,m,1-new Date(y,m,1).getDay());let h=["日","月","火","水","木","金","土"].map((w,i)=>`<div class="w ${i==0?"sun":i==6?"sat":""}">${w}</div>`).join("");
 for(let i=0;i<42;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=ymd(d),rs=T.filter(r=>r.d===k),ps=[...new Set(rs.map(r=>r.p))];
  h+=`<div class="d ${d.getMonth()!==m?"o":""} ${k===today()?"t":""} ${k===selD?"s":""} ${rs.length?"has":""}" onclick="selDay('${k}')"><span class="n">${d.getDate()}</span><div class="ic">${ps.map(p=>`<i class="dot" style="background:${PCOL[p]}"></i>`).join("")}</div></div>`;}
 $("cal").innerHTML=h;$("legend").innerHTML=Object.keys(PI).map(p=>`<span class="lg"><i class="dot" style="background:${PCOL[p]}"></i>${p}</span>`).join("");
 const rs=T.map((r,i)=>[r,i]).filter(([r])=>r.d===selD),v=rs.reduce((s,[r])=>s+vol(r),0);
 renderEval();$("dayT").textContent=`${selD} の記録`+(rs.length?`（${rs.length}種目・${v}kg）`:"");
 $("dayList").innerHTML=rs.map(([r,i])=>`<div class="log"><div class="ico">${pb(r.p)}</div><div class="t"><b>${r.ex}</b><span>${fmt(r)}${r.m?" ・"+r.m:""}</span></div>
  <button class="sm" onclick="editT(${i});tab('train')">修正</button><button class="sm" onclick="delT(${i})">削除</button></div>`).join("")||'<div class="empty">この日の記録はありません</div>';}
// その日の評価（トレーナーコメント）
function renderEval(){const rs=T.filter(r=>r.d===selD),lift=rs.filter(r=>r.p!=="有酸素"),cardio=rs.filter(r=>r.p==="有酸素");
 const box=$("evalCard"),head=`<h3>${selD} のトレーナー評価</h3>`;
 if(!rs.length){box.innerHTML=head+'<div class="empty">この日の記録はまだありません。<br>トレーニングを記録すると、点数とコメントが表示されます。</div>';return}
 const before=T.filter(r=>r.d<selD),items=[];let score=0;
 // 1 種目数 (20)
 const nEx=lift.length,p1=Math.min(20,nEx*5);score+=p1;
 items.push([p1,20,"種目数",nEx>=4?`${nEx}種目。メイン種目と補助種目がそろった、しっかりしたメニューです。`:nEx?`${nEx}種目。次はもう${4-nEx}種目足して、狙った部位を別の角度からも鍛えましょう。`:"筋トレの記録がありません。"]);
 // 2 セット数 (20)
 const nSet=lift.reduce((a,r)=>a+getSets(r).length,0),p2=nSet>=12&&nSet<=24?20:nSet>24?14:Math.round(nSet/12*20);score+=p2;
 items.push([p2,20,"総セット数",nSet>24?`${nSet}セットはやりすぎ気味です。質を落とさないよう、20セット前後に絞りましょう。`:nSet>=12?`${nSet}セット。筋肥大にちょうどいい量です。`:`${nSet}セット。少し物足りないので、12セット以上を目指しましょう。`]);
 // 3 前回からの伸び (20)
 let up=0,same=0,down=0;lift.forEach(r=>{const pv=before.filter(x=>x.ex===r.ex).sort((a,b)=>a.d<b.d?1:-1)[0];if(!pv)return;
  const a=rm(r),b=rm(pv);a>b?up++:a===b?same++:down++});
 const cmp=up+same+down,p3=cmp?Math.round((up+same*.6)/cmp*20):12;score+=p3;
 items.push([p3,20,"前回との比較",!cmp?"初めての種目が中心です。まずはフォームを固め、今日の重さを基準にしましょう。":up?`${up}種目で前回より推定1RMが伸びました。漸進性過負荷ができています。`:down?`${down}種目で前回を下回りました。疲れがたまっていないか、睡眠と食事を見直しましょう。`:"前回と同じ重さをキープ。次回は1回でも多く挙げましょう。"]);
 // 4 自己ベスト (15)
 const pb=lift.filter(r=>{const prev=Math.max(0,...before.filter(x=>x.ex===r.ex).map(rm));return prev&&rm(r)>prev}).map(r=>r.ex);
 const p4=pb.length?15:Math.round(p3/20*8);score+=p4;
 items.push([p4,15,"自己ベスト",pb.length?`${pb.join("、")} で自己ベスト更新！素晴らしいです。`:"今日は自己ベスト更新なし。ベストは毎回出るものではないので、焦らずいきましょう。"]);
 // 5 回復 (15)
 const parts=[...new Set(lift.map(r=>r.p))],tired=parts.filter(p=>before.some(x=>x.p===p&&dAgo(x.d)-dAgo(selD)<2&&x.d!==selD));
 const p5=tired.length?Math.max(0,15-tired.length*6):15;score+=p5;
 items.push([p5,15,"休養のとり方",tired.length?`${tired.join("・")}は48時間以内にも鍛えています。回復が追いつかないと逆効果なので、間を空けましょう。`:"前回から十分に休ませた部位を鍛えられています。休養のとり方も完璧です。"]);
 // 6 有酸素 (10)
 const mins=cardio.reduce((a,r)=>a+(r.min||0),0),p6=mins>=20?10:mins?6:0;score+=p6;
 items.push([p6,10,"有酸素",mins>=20?`${mins}分の有酸素。心肺機能と脂肪燃焼にも効いています。`:mins?`${mins}分の有酸素。できれば20分以上やりましょう。`:"有酸素はなし。筋トレの後に10〜20分歩くだけでも、体脂肪が落ちやすくなります。"]);
 const rank=score>=90?["S","#ffd23f","最高の1日です！この調子で続けましょう。"]:score>=75?["A","#c0c6cf","とても良いトレーニングでした。細かい点を詰めればSランクです。"]:score>=55?["B","#10b981","合格点です。下のアドバイスを1つ取り入れてみましょう。"]:["C","#f59e0b","ジムに来たこと自体が大事な一歩。次は量を少し増やしましょう。"];
 const tv=lift.reduce((a,r)=>a+vol(r),0);
 box.innerHTML=head+`<div class="evtop"><div class="rank" style="background:${rank[1]}">${rank[0]}</div><div><div class="score">${score}<small> / 100点</small></div><div class="sub">${nEx}種目・${nSet}セット・総ボリューム ${tv.toLocaleString()}kg</div></div></div>
 <div class="coach"><span class="tag">COACH</span>${rank[2]}</div>
 ${items.map(([v,m,t,c])=>`<div class="evrow"><div class="evh"><b>${t}</b><span>${v} / ${m}</span></div><div class="pbar"><i style="width:${v/m*100}%"></i></div><div class="sub">${c}</div></div>`).join("")}`;}
window.selDay=k=>{selD=k;renderCal()};
window.addOn=()=>{resetT();tab("train");$("tDate").value=selD;};

const bmiOf=r=>r.h&&r.w?r.w/((r.h/100)**2):null;
const lastH=()=>{for(let i=B.length-1;i>=0;i--)if(B[i].h)return B[i].h};
const getSets=r=>r.sets&&r.sets.length?r.sets:Array.from({length:r.s||1},()=>({w:r.w||0,r:r.r||0}));
const rm1=(w,n)=>w&&n?Math.round(n===1?w:w*(1+n/30)):0;
const rm=r=>r.p==="有酸素"?0:Math.max(0,...getSets(r).map(x=>rm1(+x.w,+x.r)));
const vol=r=>r.p==="有酸素"?0:getSets(r).reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0);
const fmt=r=>r.p==="有酸素"?`${r.min||0}分${r.km?" / "+r.km+"km":""}`:getSets(r).map(x=>`${x.w}kg×${x.r}`).join(" / ")+(rm(r)?` ・1RM ${rm(r)}kg`:"");
// セット入力
let SETS=[{w:"",r:"",m:""}];
function renderSets(){$("sets").innerHTML=SETS.map((x,i)=>`<div class="setrow"><div class="no">${i+1}</div>
 <input type="number" step="0.5" inputmode="decimal" value="${x.w}" data-i="${i}" data-k="w" placeholder="kg">
 <input type="number" inputmode="numeric" value="${x.r}" data-i="${i}" data-k="r" placeholder="回数">
 <div class="rmv" id="rm${i}">${rm1(+x.w,+x.r)?rm1(+x.w,+x.r)+" kg":"-"}</div>
 <button class="x" onclick="delSet(${i})" aria-label="セット削除">×</button>
 <div></div><input class="memo" value="${(x.m||"").replace(/"/g,"&quot;")}" data-i="${i}" data-k="m" placeholder="メモ（補助ありなど）"></div>`).join("")}
$("sets").oninput=e=>{const t=e.target,i=t.dataset.i;if(i==null)return;SETS[i][t.dataset.k]=t.value;const v=rm1(+SETS[i].w,+SETS[i].r);$("rm"+i).textContent=v?v+" kg":"-"};
window.delSet=i=>{SETS.splice(i,1);if(!SETS.length)SETS=[{w:"",r:"",m:""}];renderSets()};

// advice
function advise(){const a=[];
 if(!T.length)a.push("まだ記録がありません。まずはマシン（チェストプレス・ラットプルダウン・レッグプレス）で全身を週2回から始めましょう。");
 else{
  const lp={};T.forEach(r=>{if(!lp[r.p]||r.d>lp[r.p])lp[r.p]=r.d});
  const days=new Set(T.filter(r=>dAgo(r.d)<7).map(r=>r.d)).size;
  a.push(`直近7日のトレーニング：<b>${days}日</b>。`+(days<2?"週2〜3回を目標にしましょう。":days>5?"休養日も成長に必要。週1〜2日は休みましょう。":"良いペースです！"));
  const todo=["胸","背中","脚","肩","腕"].map(p=>[p,lp[p]?dAgo(lp[p]):999]).sort((x,y)=>y[1]-x[1]);
  const [p,g]=todo[0],sug=EX.filter(e=>e[1]===p);
  a.push(`<b>次のおすすめ：${p}</b>（${g>=999?"まだ未実施":Math.floor(g)+"日空いています"}）<br>例：${[sug[0],sug.find(e=>e[2]==="マシン"),sug.find(e=>e[2]==="ケーブル"||e[2]==="ダンベル")].filter(Boolean).map(e=>e[0]).join(" → ")}`);
  todo.filter(([,g])=>g<2).forEach(([p])=>a.push(`${p}は48時間以内に鍛えています。回復のため今日は避けましょう。`));
  const sets={};T.filter(r=>dAgo(r.d)<14).forEach(r=>sets[r.p]=(sets[r.p]||0)+r.s);
  const up=(sets["胸"]||0)+(sets["肩"]||0)+(sets["腕"]||0),lo=sets["脚"]||0;
  if(up>lo*2&&up>6)a.push("上半身に偏っています。レッグプレスやスクワットで脚も鍛えると代謝が上がります。");
  if((sets["胸"]||0)>(sets["背中"]||0)*1.5&&sets["胸"]>4)a.push("胸に比べて背中が少なめ。ラットプルダウン・シーテッドロウで姿勢改善を。");
  if(!T.some(r=>r.p==="有酸素"&&dAgo(r.d)<14))a.push("2週間有酸素運動がありません。トレ後にトレッドミルやバイク15〜20分がおすすめ。");
  [...new Set(T.filter(r=>r.p!=="有酸素").map(r=>r.ex))].forEach(ex=>{const rs=T.filter(r=>r.ex===ex).sort((x,y)=>x.d<y.d?-1:1),l=rs[rs.length-1];
   if(l.w&&l.r>=12)a.push(`${ex}：${l.w}kgで${l.r}回達成！次回は<b>${l.w+2.5}kg</b>で8〜10回を目指しましょう。`);
   else if(rs.length>=3&&rs.slice(-3).every(r=>r.w===l.w&&r.r<=l.r)&&l.w)a.push(`${ex}：3回連続停滞中。重量を10%下げてフォーム確認、または器具を変えて刺激を変えましょう。`);
   const best=Math.max(...rs.map(rm));if(best)a.push(`${ex}：推定1RM <b>${best}kg</b>。筋肥大なら${Math.round(best*.75)}kg×8〜10回、筋力アップなら${Math.round(best*.85)}kg×5回が目安。`);});
 }
 const l=B[B.length-1];
 if(l){const b=bmiOf({h:l.h||lastH(),w:l.w});
  if(b>=25)a.push(`BMI ${b.toFixed(1)}：脚・背中の大筋群＋有酸素20〜30分で脂肪燃焼を狙いましょう。`);
  if(b&&b<18.5)a.push(`BMI ${b.toFixed(1)}：たんぱく質（体重×1.6〜2g/日）と総カロリーを増やしましょう。`);
  if(l.ar&&l.al&&Math.abs(l.ar-l.al)>=1)a.push("左右の腕周囲に1cm以上の差。ダンベル種目で弱い側から始めましょう。");
  if(B.length>=2){const p=B[B.length-2];if(l.f&&p.f)a.push(`体脂肪率は前回比 <b>${(l.f-p.f>=0?"+":"")+(l.f-p.f).toFixed(1)}%</b>。`);}
 }else a.push("「体」タブで身長・体重を入れると、より具体的なアドバイスが出ます。");
 $("adv").innerHTML=a.map(x=>`<li>${x}</li>`).join("");}

function suggest(ex){const rs=T.filter(r=>r.ex===ex).sort((a,b)=>a.d<b.d?1:-1),l=rs[0];
 if(!l)return{w:0,r:10,s:3,note:"初回：軽めの重量で10回×3セット"};
 if(l.r>=12)return{w:l.w+2.5,r:8,s:l.s,note:"前回12回以上 → 重量アップ"};
 return{w:l.w,r:Math.min(l.r+1,12),s:l.s,note:"前回より+1回を目標"};}
function genMenu(){const lp={};T.forEach(r=>{if(!lp[r.p]||r.d>lp[r.p])lp[r.p]=r.d});
 const rest=["胸","背中","脚","肩","腕"].map(p=>[p,lp[p]?dAgo(lp[p]):999]).sort((x,y)=>y[1]-x[1]+Math.random()*.5-.25).filter(([,g])=>g>=2).map(x=>x[0]);
 let plan=[];// [part,count]
 if(mode==="full"||!T.length)plan=[["胸",1],["背中",1],["脚",1],["肩",1],["腹",1]];
 else if(mode==="short")plan=[[rest[0]||"脚",3]];
 else{const a=rest[0]||"脚",pair={胸:"腕",背中:"腕",脚:"腹",肩:"腕",腕:"肩"};plan=[[a,3],[rest.find(p=>p!==a&&p===pair[a])||pair[a],2]];}
 const used=new Set();MENU=[];
 plan.forEach(([p,n])=>{const pool=EX.filter(e=>e[1]===p);const fb=pool.filter(e=>e[2]==="バーベル"||e[2]==="マシン");
  const first=pick(fb.length?fb:pool,1);const rest2=pick(pool.filter(e=>!first.includes(e)),n-1);
  [...first,...rest2].forEach(e=>{if(!used.has(e[0])){used.add(e[0]);MENU.push({e,...suggest(e[0])})}})});
 if(mode!=="short")MENU.push({e:pick(EX.filter(e=>e[1]==="有酸素"),1)[0],cardio:true});
 $("menu").innerHTML=MENU.map((m,i)=>`<div class="log"><div class="ico">${pb(m.e[1])}</div><div class="t"><b>${i+1}. ${m.e[0]}</b>

  <button class="sm" onclick="useMenu(${i})">記録へ</button></div>`).join("")+`<button class="btn" onclick="logAll()">全部この内容で記録</button>`;}
window.useMenu=i=>{const m=MENU[i];resetT();cur=m.e[0];part=m.e[1];eq="すべて";
 if(m.cardio)$("tMin").value=20;else{SETS=Array.from({length:m.s},()=>({w:m.w||"",r:m.r,m:""}));renderSets()}
 renderPicker();document.querySelector('.tabbar [data-t="train"]').click();};
window.logAll=()=>ask("メニュー通りに今日の記録として保存しますか？（後から修正できます）",()=>{
 MENU.forEach(m=>T.push(m.cardio?{d:today(),p:"有酸素",eq:"有酸素",ex:m.e[0],min:20,km:0,w:0,r:0,s:1}:{d:today(),p:m.e[1],eq:m.e[2],ex:m.e[0],w:m.w,r:m.r,s:m.s,sets:Array.from({length:m.s},()=>({w:m.w,r:m.r,m:""})),m:"おまかせメニュー"}));
 sv("gym_t",T);renderT();alert("保存しました！");});
