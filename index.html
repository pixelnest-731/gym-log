<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マスキュラーズ</title>
<meta name="apple-mobile-web-app-title" content="マスキュラーズ">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--fg:#151a24;--mut:#6b7280;--ac:#2563eb;--ac2:#38bdf8;--bd:#e6e8ee;--sh:0 4px 18px rgba(20,30,60,.08);--chip:#f1f3f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--card:#181b23;--fg:#eceef3;--mut:#9aa1ad;--bd:#272b36;--sh:0 4px 18px rgba(0,0,0,.4);--chip:#222632;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1015;--card:#181b23;--fg:#eceef3;--mut:#9aa1ad;--bd:#272b36;--sh:0 4px 18px rgba(0,0,0,.4);--chip:#222632;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#1e40af,#2563eb 55%,#38bdf8);color:#fff;padding:22px 16px 56px;position:relative;overflow:hidden}
header::after{content:"🏋️";position:absolute;right:-10px;top:-10px;font-size:120px;opacity:.15}
header h1{margin:0;font-size:22px;letter-spacing:.05em}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
main{max-width:920px;margin:-40px auto 0;padding:0 16px;position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh);text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--ac)}
.stat .l{font-size:11px;color:var(--mut)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2))}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font-size:15px}
input:focus,select:focus{outline:2px solid var(--ac2);border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn{margin-top:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn.gray{background:#8a8f99;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:300px;overflow:auto;margin-top:10px;padding:2px}
.ex{border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;text-align:left;color:var(--fg);font-size:13px}
.ex small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.ex.on{border-color:var(--ac);background:rgba(37,99,235,.08);font-weight:700}
.sel{margin-top:10px;padding:10px;border-radius:10px;background:var(--chip);font-size:14px}
.log{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.log:last-child{border:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--chip)}
.log .t{flex:1;min-width:0}.log .t b{display:block;font-size:14px}.log .t span{font-size:12px;color:var(--mut)}
.sm{padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.dh{font-size:12px;font-weight:700;color:var(--ac);margin-top:14px}
.big{font-size:40px;font-weight:800}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.adv li{list-style:none;margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--chip);line-height:1.6;font-size:14px}
.adv{padding:0;margin:0}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:9}
.tabbar button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;cursor:pointer}
.tabbar button i{display:block;font-style:normal;font-size:22px}
.tabbar button.on{color:var(--ac);font-weight:700}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);color:var(--fg);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center}
.modal .btn{margin:14px 4px 0}
.modal.hidden{display:none}
.homebtn{position:absolute;right:14px;top:16px;z-index:2;border:0;background:rgba(255,255,255,.22);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.bigbtn{width:100%;border:0;border-radius:16px;padding:18px;margin-bottom:16px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#1e40af,#2563eb,#38bdf8);box-shadow:0 6px 18px rgba(37,99,235,.35)}
.bigbtn small{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:4px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.cal .d{min-height:58px;border-radius:10px;background:var(--bg);padding:4px;cursor:pointer;font-size:12px;border:2px solid transparent;overflow:hidden}
.cal .d.o{opacity:.35}.cal .d.t .n{background:var(--ac);color:#fff;border-radius:50%;display:inline-block;width:20px;text-align:center}
.cal .d.s{border-color:var(--ac)}.cal .d.has{background:rgba(37,99,235,.1)}
.cal .ic{font-size:11px;line-height:1.1;word-break:break-all}
.chr{display:flex;gap:14px;align-items:center}
.chr .face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#dbeafe,#93c5fd);flex:none}
.chr .nm{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--mut)}
.pbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:8px 0 4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.win{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.win span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}.sync .sub{margin:0}
.timer{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:10px 12px;border:2px solid var(--ac);border-radius:999px;font-size:13px}
.timer input{width:64px;padding:6px;text-align:center}.timer b{margin-left:auto;font-size:18px;color:var(--ac);font-variant-numeric:tabular-nums}
.sethead,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 64px 30px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--mut);margin-top:8px;padding:0 4px}
.setrow{padding:8px 4px;border-bottom:1px solid var(--bd)}.setrow .no{font-size:18px;font-weight:700;text-align:center}
.setrow input{padding:8px;text-align:right;font-size:16px;font-weight:700}.setrow .rmv{font-size:13px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.setrow .memo{grid-column:2/5;padding:6px 8px;font-size:13px;font-weight:400;text-align:left}
.setrow .x{border:0;background:var(--chip);color:var(--mut);border-radius:50%;width:26px;height:26px;cursor:pointer}
.setbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.evtop{display:flex;align-items:center;gap:14px}.rank{width:64px;height:64px;border-radius:16px;color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;flex:none}
.score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.score small{font-size:14px;color:var(--mut);font-weight:400}
.coach{margin:12px 0 4px;padding:12px;border-radius:12px;background:var(--chip);font-size:14px;line-height:1.6}
.evrow{margin-top:12px}.evh{display:flex;justify-content:space-between;font-size:13px}.evh span{color:var(--mut);font-variant-numeric:tabular-nums}.evrow .pbar{margin:4px 0}
.w.sun{color:#ef4444}.w.sat{color:#2563eb}
.empty{text-align:center;color:var(--mut);padding:20px;font-size:14px}
</style>
<header><button class="homebtn" onclick="goHome()">🏠 ホーム</button><h1 onclick="goHome()" style="cursor:pointer">マスキュラーズ</h1><p id="hello">今日もナイスバルク！💪</p></header>
<main>
<div class="stats">
 <div class="stat"><div class="v" id="sDays">0</div><div class="l">総トレ日数</div></div>
 <div class="stat"><div class="v" id="sWeek">0</div><div class="l">今週の日数</div></div>
 <div class="stat"><div class="v" id="sVol">0</div><div class="l">今週ボリューム(t)</div></div>
 <div class="stat"><div class="v" id="sBmi">-</div><div class="l">最新BMI</div></div>
</div>

<section id="home">
 <div class="card sync" id="syncCard"><div class="sub" id="syncMsg">☁️ 読み込み中…</div><button class="sm" id="syncBtn" hidden></button></div>
 <button class="bigbtn" onclick="goMenu()">🎲 今日のメニューをおまかせで組む<small>休んでいる部位から自動でメニューを作ります</small></button>
 <div class="card">
  <div class="calh"><button class="sm" onclick="mv(-1)">◀</button><b id="calM"></b><button class="sm" onclick="mv(1)">▶</button></div>
  <div class="cal" id="cal"></div>
  <div class="mut" style="font-size:11px;color:var(--mut);margin-top:8px" id="legend"></div>
 </div>
 <div class="card"><h3 id="dayT"></h3><div id="dayList"></div><button class="btn" onclick="addOn()">＋ この日に記録を追加</button></div>
 <div class="card" id="evalCard"></div>
</section>

<section id="train" class="hidden">
 <div class="card">
  <h3 id="tTitle">トレーニングを記録</h3>
  <label>部位</label><div class="chips" id="parts"></div>
  <label>器具</label><div class="chips" id="eqs"></div>
  <input id="q" placeholder="🔍 種目を検索" style="margin-top:10px">
  <div class="exgrid" id="exs"></div>
  <div class="sel" id="selEx">種目を選んでください</div>
  <div class="row">
   <div><label>日付</label><input type="date" id="tDate"></div>
   <div class="cd hidden"><label>時間(分)</label><input type="number" id="tMin"></div>
   <div class="cd hidden"><label>距離(km)</label><input type="number" id="tKm" step="0.1"></div>
  </div>
  <div class="st">
   <div class="timer"><span>⏱ インターバル</span><input type="number" id="tmSec" value="60" min="5" step="5"><span>秒</span><b id="tmLeft"></b><button class="sm" id="tmBtn">START</button></div>
   <div class="sethead"><span>セット</span><span>重さ(kg)</span><span>回数</span><span>RM</span><span></span></div>
   <div id="sets"></div>
   <div class="setbtns"><button class="sm" id="addSet">＋ セットを追加</button><button class="sm" id="copyLast">📋 前回の記録をコピー</button></div>
  </div>
  <label>種目のメモ（マシン番号・シート位置など）</label><input id="tMemo">
  <button class="btn" id="tSave">💾 保存する</button> <button class="btn gray hidden" id="tCancel">キャンセル</button>
 </div>
 <div class="card"><h3>履歴</h3><div id="tList"></div></div>
</section>

<section id="body" class="hidden">
 <div class="card" style="text-align:center"><div style="font-size:12px;color:var(--mut)">最新BMI</div><div class="big" id="bmi">-</div><span class="badge" id="bmiJ"></span></div>
 <div class="card">
  <h3 id="bTitle">体の記録</h3>
  <div class="row">
   <div><label>日付</label><input type="date" id="bDate"></div>
   <div><label>身長(cm)</label><input type="number" id="bH" step="0.1"></div>
   <div><label>体重(kg)</label><input type="number" id="bWt" step="0.1"></div>
   <div><label>体脂肪率(%)</label><input type="number" id="bF" step="0.1"></div>
   <div><label>腕周囲 右(cm)</label><input type="number" id="bAR" step="0.1"></div>
   <div><label>腕周囲 左(cm)</label><input type="number" id="bAL" step="0.1"></div>
  </div>
  <button class="btn" id="bSave">💾 保存する</button> <button class="btn gray hidden" id="bCancel">キャンセル</button>
 </div>
 <div class="card"><h3>履歴</h3><div id="bList"></div></div>
</section>

<section id="graph" class="hidden">
 <div class="card"><h3>種目別 最大重量・推定1RM</h3><select id="gEx"></select><canvas id="c1"></canvas></div>
 <div class="card"><h3>部位別 総ボリューム</h3><canvas id="c2"></canvas></div>
 <div class="card"><h3>日別ボリューム</h3><canvas id="c6"></canvas></div>
 <div class="card"><h3>体重・体脂肪率</h3><canvas id="c3"></canvas></div>
 <div class="card"><h3>BMI</h3><canvas id="c4"></canvas></div>
 <div class="card"><h3>腕周囲</h3><canvas id="c5"></canvas></div>
</section>

<section id="advice" class="hidden">
 <div class="card"><h3>今日のおすすめメニュー</h3>
  <div class="chips" id="mMode"><button class="chip on" data-m="auto">おまかせ</button><button class="chip" data-m="full">全身</button><button class="chip" data-m="short">時短30分</button></div>
  <div id="menu" style="margin-top:10px"></div>
  <button class="btn" id="mGen">🎲 メニューを組む</button>
 </div>
 <div class="card"><h3>コーチからのアドバイス</h3><ul class="adv" id="adv"></ul></div>
</section>
</main>

<nav class="tabbar">
 <button data-t="home" class="on"><i>🏠</i>ホーム</button>
 <button data-t="train"><i>🏋️</i>記録</button>
 <button data-t="body"><i>📏</i>体</button>
 <button data-t="graph"><i>📊</i>グラフ</button>
 <button data-t="advice"><i>💡</i>アドバイス</button>
</nav>

<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div><div id="mMsg"></div><button class="btn gray" id="mNo">キャンセル</button><button class="btn" id="mYes">OK</button></div></div>
<script>
function alert(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200)}
function ask(m,fn){const md=document.getElementById("modal");document.getElementById("mMsg").textContent=m;md.classList.remove("hidden");
 document.getElementById("mYes").onclick=()=>{md.classList.add("hidden");fn()};document.getElementById("mNo").onclick=()=>md.classList.add("hidden")}
// [名前, 部位, 器具]
const PI={"胸":"🫁","背中":"🦅","脚":"🦵","肩":"🎯","腕":"💪","腹":"🔥","有酸素":"🏃"};
const EX=[
["ベンチプレス","胸","バーベル"],["インクラインベンチプレス","胸","バーベル"],["デクラインベンチプレス","胸","バーベル"],
["ダンベルプレス","胸","ダンベル"],["インクラインダンベルプレス","胸","ダンベル"],["ダンベルフライ","胸","ダンベル"],["ダンベルプルオーバー","胸","ダンベル"],
["チェストプレス","胸","マシン"],["インクラインチェストプレス","胸","マシン"],["ペックフライ(バタフライ)","胸","マシン"],["スミスマシン ベンチプレス","胸","スミスマシン"],["スミス インクラインプレス","胸","スミスマシン"],
["ケーブルクロスオーバー","胸","ケーブル"],["ケーブルフライ(ロー→ハイ)","胸","ケーブル"],["腕立て伏せ","胸","自重"],["ディップス","胸","自重"],
["デッドリフト","背中","バーベル"],["ルーマニアンデッドリフト","背中","バーベル"],["ベントオーバーロウ","背中","バーベル"],["Tバーロウ","背中","バーベル"],
["ワンハンドロウ","背中","ダンベル"],["ダンベルシュラッグ","背中","ダンベル"],
["ラットプルダウン","背中","マシン"],["シーテッドロウ","背中","マシン"],["ローロウ","背中","マシン"],["バックエクステンション","背中","マシン"],["アシスト懸垂(チンニング)","背中","マシン"],
["ケーブルロウ","背中","ケーブル"],["ストレートアームプルダウン","背中","ケーブル"],["フェイスプル","背中","ケーブル"],["スミス ロウ","背中","スミスマシン"],["懸垂","背中","自重"],
["スクワット","脚","バーベル"],["フロントスクワット","脚","バーベル"],["ヒップスラスト","脚","バーベル"],
["ブルガリアンスクワット","脚","ダンベル"],["ダンベルランジ","脚","ダンベル"],["ゴブレットスクワット","脚","ダンベル"],
["レッグプレス","脚","マシン"],["レッグエクステンション","脚","マシン"],["レッグカール(シーテッド)","脚","マシン"],["レッグカール(ライイング)","脚","マシン"],
["アダクション(内もも)","脚","マシン"],["アブダクション(外もも)","脚","マシン"],["カーフレイズ","脚","マシン"],["ハックスクワット","脚","マシン"],
["スミス スクワット","脚","スミスマシン"],["スミス ランジ","脚","スミスマシン"],["ケーブルキックバック(臀部)","脚","ケーブル"],
["ショルダープレス(バーベル)","肩","バーベル"],["アップライトロウ","肩","バーベル"],
["ダンベルショルダープレス","肩","ダンベル"],["サイドレイズ","肩","ダンベル"],["フロントレイズ","肩","ダンベル"],["リアレイズ","肩","ダンベル"],["アーノルドプレス","肩","ダンベル"],
["ショルダープレス(マシン)","肩","マシン"],["リアデルト(マシン)","肩","マシン"],["ラテラルレイズ(マシン)","肩","マシン"],
["ケーブルサイドレイズ","肩","ケーブル"],["スミス ショルダープレス","肩","スミスマシン"],
["バーベルカール","腕","バーベル"],["EZバーカール","腕","バーベル"],["ナローベンチプレス","腕","バーベル"],["ライイングトライセプスEX","腕","バーベル"],
["ダンベルカール","腕","ダンベル"],["ハンマーカール","腕","ダンベル"],["インクラインカール","腕","ダンベル"],["コンセントレーションカール","腕","ダンベル"],["フレンチプレス","腕","ダンベル"],["キックバック","腕","ダンベル"],
["アームカール(マシン)","腕","マシン"],["トライセプスEX(マシン)","腕","マシン"],["プリーチャーカール","腕","マシン"],
["ケーブルカール","腕","ケーブル"],["トライセプスプッシュダウン","腕","ケーブル"],["オーバーヘッドケーブルEX","腕","ケーブル"],["リストカール","腕","ダンベル"],
["クランチ","腹","自重"],["レッグレイズ","腹","自重"],["プランク(秒)","腹","自重"],["アブローラー","腹","自重"],["ハンギングレッグレイズ","腹","自重"],["ロシアンツイスト","腹","ダンベル"],
["アブドミナル(マシン)","腹","マシン"],["ロータリートルソー","腹","マシン"],["ケーブルクランチ","腹","ケーブル"],["サイドベント","腹","ダンベル"],

function renderEval(){const rs=T.filter(r=>r.d===selD),lift=rs.filter(r=>r.p!=="有酸素"),cardio=rs.filter(r=>r.p==="有酸素");

 const before=T.filter(r=>r.d<selD),items=[];let score=0;
 // 1 種目数 (20)
 const nEx=lift.length,p1=Math.min(20,nEx*5);score+=p1;
 items.push([p1,20,"種目数",nEx>=4?`${nEx}種目。メイン種目と補助種目がそろった、しっかりしたメニューです。`:nEx?`${nEx}種目。次はもう${4-nEx}種目足して、狙った部位を別の角度からも鍛えましょう。`:"筋トレの記録がありません。"]);

 const nSet=lift.reduce((a,r)=>a+getSets(r).length,0),p2=nSet>=12&&nSet<=24?20:nSet>24?14:Math.round(nSet/12*20);score+=p2;
 items.push([p2,20,"総セット数",nSet>24?`${nSet}セットはやりすぎ気味です。質を落とさないよう、20セット前後に絞りましょう。`:nSet>=12?`${nSet}セット。筋肥大にちょうどいい量です。`:`${nSet}セット。少し物足りないので、12セット以上を目指しましょう。`]);
 // 3 前回からの伸び (20)
 let up=0,same=0,down=0;lift.forEach(r=>{const pv=before.filter(x=>x.ex===r.ex).sort((a,b)=>a.d<b.d?1:-1)[0];if(!pv)return;
  const a=rm(r),b=rm(pv);a>b?up++:a===b?same++:down++});
 const cmp=up+same+down,p3=cmp?Math.round((up+same*.6)/cmp*20):12;score+=p3;
 items.push([p3,20,"前回との比較",!cmp?"初めての種目が中心です。まずはフォームを固め、今日の重さを基準にしましょう。":up?`${up}種目で前回より推定1RMが伸びました。漸進性過負荷ができています。`:down?`${down}種目で前回を下回りました。疲れがたまっていないか、睡眠と食事を見直しましょう。`:"前回と同じ重さをキープ。次回は1回でも多く挙げましょう。"]);
 // 4 自己ベスト (15)

 // 5 回復 (15)
 const parts=[...new Set(lift.map(r=>r.p))],tired=parts.filter(p=>before.some(x=>x.p===p&&dAgo(x.d)-dAgo(selD)<2&&x.d!==selD));
 const p5=tired.length?Math.max(0,15-tired.length*6):15;score+=p5;
 items.push([p5,15,"休養のとり方",tired.length?`${tired.join("・")}は48時間以内にも鍛えています。回復が追いつかないと逆効果なので、間を空けましょう。`:"前回から十分に休ませた部位を鍛えられています。休養のとり方も完璧です。"]);
 // 6 有酸素 (10)
 const mins=cardio.reduce((a,r)=>a+(r.min||0),0),p6=mins>=20?10:mins?6:0;score+=p6;
 items.push([p6,10,"有酸素",mins>=20?`${mins}分の有酸素。心肺機能と脂肪燃焼にも効いています。`:mins?`${mins}分の有酸素。できれば20分以上やりましょう。`:"有酸素はなし。筋トレの後に10〜20分歩くだけでも、体脂肪が落ちやすくなります。"]);

 const tv=lift.reduce((a,r)=>a+vol(r),0);
 box.innerHTML=head+`<div class="evtop"><div class="rank" style="background:${rank[1]}">${rank[0]}</div><div><div class="score">${score}<small> / 100点</small></div><div class="sub">${nEx}種目・${nSet}セット・総ボリューム ${tv.toLocaleString()}kg</div></div></div>

  const days=new Set(T.filter(r=>dAgo(r.d)<7).map(r=>r.d)).size;
  a.push(`📅 直近7日のトレーニング：<b>${days}日</b>。`+(days<2?"週2〜3回を目標にしましょう。":days>5?"休養日も成長に必要。週1〜2日は休みましょう。":"良いペースです！"));
  const todo=["胸","背中","脚","肩","腕"].map(p=>[p,lp[p]?dAgo(lp[p]):999]).sort((x,y)=>y[1]-x[1]);
  const [p,g]=todo[0],sug=EX.filter(e=>e[1]===p);
  a.push(`🎯 <b>次のおすすめ：${PI[p]} ${p}</b>（${g>=999?"まだ未実施":Math.floor(g)+"日空いています"}）<br>例：${[sug[0],sug.find(e=>e[2]==="マシン"),sug.find(e=>e[2]==="ケーブル"||e[2]==="ダンベル")].filter(Boolean).map(e=>e[0]).join(" → ")}`);
  todo.filter(([,g])=>g<2).forEach(([p])=>a.push(`😴 ${p}は48時間以内に鍛えています。回復のため今日は避けましょう。`));
  const sets={};T.filter(r=>dAgo(r.d)<14).forEach(r=>sets[r.p]=(sets[r.p]||0)+r.s);
  const up=(sets["胸"]||0)+(sets["肩"]||0)+(sets["腕"]||0),lo=sets["脚"]||0;
  if(up>lo*2&&up>6)a.push("⚖️ 上半身に偏っています。レッグプレスやスクワットで脚も鍛えると代謝が上がります。");
  if((sets["胸"]||0)>(sets["背中"]||0)*1.5&&sets["胸"]>4)a.push("⚖️ 胸に比べて背中が少なめ。ラットプルダウン・シーテッドロウで姿勢改善を。");
  if(!T.some(r=>r.p==="有酸素"&&dAgo(r.d)<14))a.push("🏃 2週間有酸素運動がありません。トレ後にトレッドミルやバイク15〜20分がおすすめ。");
  [...new Set(T.filter(r=>r.p!=="有酸素").map(r=>r.ex))].forEach(ex=>{const rs=T.filter(r=>r.ex===ex).sort((x,y)=>x.d<y.d?-1:1),l=rs[rs.length-1];
   if(l.w&&l.r>=12)a.push(`📈 ${ex}：${l.w}kgで${l.r}回達成！次回は<b>${l.w+2.5}kg</b>で8〜10回を目指しましょう。`);
   else if(rs.length>=3&&rs.slice(-3).every(r=>r.w===l.w&&r.r<=l.r)&&l.w)a.push(`🧱 ${ex}：3回連続停滞中。重量を10%下げてフォーム確認、または器具を変えて刺激を変えましょう。`);
   const best=Math.max(...rs.map(rm));if(best)a.push(`🏆 ${ex}：推定1RM <b>${best}kg</b>。筋肥大なら${Math.round(best*.75)}kg×8〜10回、筋力アップなら${Math.round(best*.85)}kg×5回が目安。`);});
 }
 const l=B[B.length-1];
 if(l){const b=bmiOf({h:l.h||lastH(),w:l.w});
  if(b>=25)a.push(`🔥 BMI ${b.toFixed(1)}：脚・背中の大筋群＋有酸素20〜30分で脂肪燃焼を狙いましょう。`);
  if(b&&b<18.5)a.push(`🍚 BMI ${b.toFixed(1)}：たんぱく質（体重×1.6〜2g/日）と総カロリーを増やしましょう。`);
  if(l.ar&&l.al&&Math.abs(l.ar-l.al)>=1)a.push("💪 左右の腕周囲に1cm以上の差。ダンベル種目で弱い側から始めましょう。");
  if(B.length>=2){const p=B[B.length-2];if(l.f&&p.f)a.push(`📉 体脂肪率は前回比 <b>${(l.f-p.f>=0?"+":"")+(l.f-p.f).toFixed(1)}%</b>。`);}
 }else a.push("📏 「体」タブで身長・体重を入れると、より具体的なアドバイスが出ます。");
 $("adv").innerHTML=a.map(x=>`<li>${x}</li>`).join("");}

// daily menu generator
let mode="auto",MENU=[];
$("mMode").onclick=e=>{const b=e.target.closest("[data-m]");if(b){mode=b.dataset.m;document.querySelectorAll("#mMode .chip").forEach(x=>x.classList.toggle("on",x===b));genMenu()}};
const pick=(arr,n)=>[...arr].sort(()=>Math.random()-.5).slice(0,n);
function suggest(ex){const rs=T.filter(r=>r.ex===ex).sort((a,b)=>a.d<b.d?1:-1),l=rs[0];
 if(!l)return{w:0,r:10,s:3,note:"初回：軽めの重量で10回×3セット"};
 if(l.r>=12)return{w:l.w+2.5,r:8,s:l.s,note:"前回12回以上 → 重量アップ"};
 return{w:l.w,r:Math.min(l.r+1,12),s:l.s,note:"前回より+1回を目標"};}
function genMenu(){const lp={};T.forEach(r=>{if(!lp[r.p]||r.d>lp[r.p])lp[r.p]=r.d});
 const rest=["胸","背中","脚","肩","腕"].map(p=>[p,lp[p]?dAgo(lp[p]):999]).sort((x,y)=>y[1]-x[1]+Math.random()*.5-.25).filter(([,g])=>g>=2).map(x=>x[0]);
 let plan=[];// [part,count]
 if(mode==="full"||!T.length)plan=[["胸",1],["背中",1],["脚",1],["肩",1],["腹",1]];
 else if(mode==="short")plan=[[rest[0]||"脚",3]];
 else{const a=rest[0]||"脚",pair={胸:"腕",背中:"腕",脚:"腹",肩:"腕",腕:"肩"};plan=[[a,3],[rest.find(p=>p!==a&&p===pair[a])||pair[a],2]];}
 const used=new Set();MENU=[];
 plan.forEach(([p,n])=>{const pool=EX.filter(e=>e[1]===p);const fb=pool.filter(e=>e[2]==="バーベル"||e[2]==="マシン");
  const first=pick(fb.length?fb:pool,1);const rest2=pick(pool.filter(e=>!first.includes(e)),n-1);
  [...first,...rest2].forEach(e=>{if(!used.has(e[0])){used.add(e[0]);MENU.push({e,...suggest(e[0])})}})});
 if(mode!=="short")MENU.push({e:pick(EX.filter(e=>e[1]==="有酸素"),1)[0],cardio:true});
 $("menu").innerHTML=MENU.map((m,i)=>`<div class="log"><div class="ico">${PI[m.e[1]]}</div><div class="t"><b>${i+1}. ${m.e[0]}</b>
  <span>${m.cardio?"20分（会話できる強度で）":`${m.w?m.w+"kg":"重量は様子見"} × ${m.r}回 × ${m.s}セット ・ ${m.note}`}</span></div>
  <button class="sm" onclick="useMenu(${i})">記録へ</button></div>`).join("")+`<button class="btn" onclick="logAll()">✅ 全部この内容で記録</button>`;}
window.useMenu=i=>{const m=MENU[i];resetT();cur=m.e[0];part=m.e[1];eq="すべて";
 if(m.cardio)$("tMin").value=20;else{SETS=Array.from({length:m.s},()=>({w:m.w||"",r:m.r,m:""}));renderSets()}
 renderPicker();document.querySelector('.tabbar [data-t="train"]').click();};
window.logAll=()=>ask("メニュー通りに今日の記録として保存しますか？（後から修正できます）",()=>{
 MENU.forEach(m=>T.push(m.cardio?{d:today(),p:"有酸素",eq:"有酸素",ex:m.e[0],min:20,km:0,w:0,r:0,s:1}:{d:today(),p:m.e[1],eq:m.e[2],ex:m.e[0],w:m.w,r:m.r,s:m.s,sets:Array.from({length:m.s},()=>({w:m.w,r:m.r,m:""})),m:"おまかせメニュー"}));
 sv("gym_t",T);renderT();alert("保存しました！");});
$("mGen").onclick=genMenu;

const h=new Date().getHours();$("hello").textContent=(h<11?"おはようございます":h<18?"こんにちは":"こんばんは")+"！今日もナイスバルク💪";
renderPicker();renderT();renderB();renderCal();
if(!okStore){const w=document.createElement("div");w.className="card";w.style.border="2px solid #ef4444";w.innerHTML="⚠️ <b>このブラウザでは記録が保存されません。</b><br>プライベート（シークレット）モードをやめるか、SafariやChromeで https://yuji2069807165433243-tech.github.io/gym-log/ を開いてください。";document.querySelector("main").prepend(w)}
// ---- Googleアカウント同期（Firebase） ----
// Firebaseコンソールの「ウェブアプリの設定」の値をここに入れる
const FIREBASE_CONFIG=null;
let fbUser=null,fdb=null,saveT=null;
function syncUI(msg,btn,fn){$("syncMsg").innerHTML=msg;const b=$("syncBtn");b.hidden=!btn;if(btn){b.textContent=btn;b.onclick=fn}}
function cloudSave(){if(!fbUser||!fdb)return;clearTimeout(saveT);saveT=setTimeout(()=>{
 fdb.collection("users").doc(fbUser.uid).set({t:T,b:B,updated:Date.now()}).then(()=>syncUI(`☁️ <b>${fbUser.displayName||"Google"}</b> で同期中・保存しました`,"ログアウト",logout)).catch(e=>syncUI("⚠️ 保存に失敗："+e.code,"再試行",cloudSave))},800)}
function mergeArr(a,b){const m=new Map();[...a,...b].forEach(r=>m.set(JSON.stringify(r),r));return[...m.values()]}
async function onLogin(u){fbUser=u;syncUI("☁️ クラウドから読み込み中…");
 try{const d=await fdb.collection("users").doc(u.uid).get();
  if(d.exists){const c=d.data();T=mergeArr(c.t||[],T);B=mergeArr(c.b||[],B);
   try{localStorage.setItem("gym_t",JSON.stringify(T));localStorage.setItem("gym_b",JSON.stringify(B))}catch{}}
  renderT();renderB();renderCal();cloudSave();
  syncUI(`☁️ <b>${u.displayName||"Google"}</b> で同期中`,"ログアウト",logout);
 }catch(e){syncUI("⚠️ 読み込みに失敗："+e.code,"再試行",()=>onLogin(u))}}
function login(){const pr=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(pr).catch(e=>{
 if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")firebase.auth().signInWithRedirect(pr);else alert("ログインできませんでした："+e.code)})}
function logout(){firebase.auth().signOut()}
function loadJs(u){return new Promise((ok,ng)=>{const x=document.createElement("script");x.src=u;x.onload=ok;x.onerror=ng;document.head.appendChild(x)})}
(async()=>{if(!FIREBASE_CONFIG){$("syncCard").hidden=true;return}
 try{const v="https://www.gstatic.com/firebasejs/10.12.2/";
  await loadJs(v+"firebase-app-compat.js");await Promise.all([loadJs(v+"firebase-auth-compat.js"),loadJs(v+"firebase-firestore-compat.js")]);
  firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{if(u)onLogin(u);else{fbUser=null;syncUI("☁️ Googleでログインすると、記録を別の端末に引き継げます","Googleでログイン",login)}});
 }catch(e){syncUI("☁️ この画面では同期を使えません（GitHub版で利用できます）")}})();
renderSets();
